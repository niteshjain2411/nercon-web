server.port=8080
server.servlet.context-path=/nercon
spring.application.name=NERCON 2026 Registration System

# Logging
logging.level.root=INFO
logging.level.org.example=DEBUG
logging.file.name=logs/nercon.log

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# View resolver configuration
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html
spring.resources.static-locations=classpath:/
spring.web.resources.static-locations=classpath:/

# Enable static content serving
spring.web.resources.add-mappings=true

# Firebase configuration
# Path to the Firebase service account key JSON file (download from Firebase Console > Project Settings > Service Accounts)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:service-account.json}
firebase.project.id=${GOOGLE_CLOUD_PROJECT:nercon26-f8914}
# Firebase Storage bucket name (e.g. your-project-id.appspot.com)
firebase.storage.bucket=nercon26-f8914.firebasestorage.app

# ---------------------------------------------------------------
# Mail configuration — Gmail API via OAuth2 (HTTPS, works on Cloud Run)
# ---------------------------------------------------------------
spring.mail.from=websitenercon2026@gmail.com
gmail.client.id=${GMAIL_CLIENT_ID:}
gmail.client.secret=${GMAIL_CLIENT_SECRET:}
gmail.refresh.token=${GMAIL_REFRESH_TOKEN:}

